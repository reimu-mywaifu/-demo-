                <h3>從記憶中的味道出發</h3>
                <p>「沐光小食」創立於 2026 年，我們希望在繁雜的城市中，提供一個能讓人靜下心來，好好吃頓飯的角落。</p>
                <p>我們的設計理念揉合了現代簡約與莫蘭迪色調，不只是空間，我們希望連餐點都能帶給您舒適、無負擔的感受。</p>
                <p>堅持使用原型食物與在地小農食材，不添加過多的人工調味。每一碗麵、每一份小菜，都是我們對「真實美味」的詮釋。</p>
                <p>沐浴在晨光下，品嚐一口溫潤。歡迎來到沐光小食。</p>
